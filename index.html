const N=10,qs={mode:'order',kind:'sign',stage:1,run:null};
const bkey=()=>qs.kind+'|'+(qs.mode=='order'?'o'+qs.stage:'r');
function pool(){const ks=G.slice(0,qs.mode=='order'?qs.stage:5).flatMap(g=>g[2]);const own=qs.mode=='order'?G[qs.stage-1][2]:ks;
 return qs.kind=='sign'?{items:ks.map(k=>({id:'s'+k,k})),own:o=>own.includes(o.k)}:{items:C.filter(c=>c[3].every(k=>ks.includes(k))).map(c=>({id:'c'+c[0],c})),own:o=>o.c[3].some(k=>own.includes(k))}}
function pick(P,not){const W=LS.get('taamim_w',{});let list=P.items.filter(o=>o.id!=not);if(!list.length)list=P.items;
 const w=list.map(o=>(P.own(o)?2.5:1)*(W[o.id]||1));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[0]}
function bump(id,ok){const W=LS.get('taamim_w',{});W[id]=ok?Math.max(1,(W[id]||1)-1):Math.min(12,(W[id]||1)+3);LS.set('taamim_w',W)}

 const ch=(a,v,l,i)=>`<button class="${qs[a]==v?'on':''}" onclick="setq('${a}',${typeof v=='number'?v:`'${v}'`})">${i?ic(i,18):''}${l}</button>`;

 `<p class="sc2" style="display:flex;gap:6px;align-items:center">${ic('award',18)}${t('q_record')}: <span class="rec">${bt?bt.pct+'%':t('q_none')}</span></p>`;
 const P=pool();if(!qs.run)qs.run={i:0,ok:0,wrong:[],last:null};const R=qs.run;
 if(R.i>=N){const pct=Math.round(R.ok/N*100);const rec=!bt||pct>bt.pct;if(rec&&!R.saved){B[bkey()]={pct};LS.set('taamim_best',B)}R.saved=1;
  const v=t(pct==100?'q_v100':pct>=80?'q_v80':pct>=60?'q_v60':'q_v0');
  h+=`<div class="card q"><p class="sc2">${t('q_result')}</p><div class="big">${t('q_score',{a:R.ok,b:N})}</div><p>${pct}% · ${v}</p>${rec&&pct>0?`<p class="rec">${ic('award',18)} ${t('q_new_rec')}</p>`:''}${R.wrong.length?`<p class="sc2" style="margin-top:10px">${t('q_review')}</p><p><b>${[...new Set(R.wrong)].join(', ')}</b></p>`:''}<div class="chips" style="justify-content:center"><button onclick="qs.run=null;quiz()" class="on">${ic('redo',18)}${t('q_again')}</button></div></div>`;
  M().innerHTML=h;return}
 const it=pick(P,R.last);R.last=it.id;const pn=o=>qs.kind=='sign'?K[o.k][1]:cl(o.c);
 const o=[it];let g=0;while(o.length<Math.min(4,P.items.length)&&g++<50){const x=P.items[Math.floor(Math.random()*P.items.length)];if(!o.includes(x)&&pn(x)!=pn(it))o.push(x)}o.sort(()=>Math.random()-.5);
 const big=qs.kind=='sign'?`<div class="g">${gl(it.k)}</div>`:`<div class="gs">${it.c[3].map(gl).join('')}</div>`;
 h+=`<div class="card q"><p class="sc2">${t('q_of',{i:R.i+1,n:N})}</p><div class="bar"><b style="width:${R.i/N*100}%"></b></div><p>${t(qs.kind=='sign'?'q_ask_sign':'q_ask_combo')}</p>${big}<div class="opts">${o.map(x=>`<button class="btn" data-id="${x.id}">${pn(x)}</button>`).join('')}</div><button class="btn" id="nx" style="display:none;background:var(--ac);color:var(--bg);border-color:var(--ac)">${R.i+1<N?t('q_next'):t('q_result')}</button></div>`;
 M().innerHTML=h;
 M().querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{M().querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.id==it.id)x.classList.add('ok')});const good=b.dataset.id==it.id;if(good)R.ok++;else{b.classList.add('no');R.wrong.push(pn(it))}bump(it.id,good);R.i++;const n=document.getElementById('nx');n.style.display='inline-block';n.onclick=()=>quiz()})}

const MK={0x591:'et',0x592:'seg',0x593:'sha',0x594:'zk',0x595:'zg',0x596:'tip',0x597:'rev',0x598:'zar',0x599:'pas',0x59A:'yet',0x59B:'tev',0x59C:'ger',0x59D:'ger',0x59E:'gsh',0x59F:'kar',0x5A0:'tg',0x5A1:'paz',0x5A3:'mun',0x5A4:'map',0x5A5:'mer',0x5A6:'mek',0x5A7:'dar',0x5A8:'kad',0x5A9:'tk',0x5AA:'yer',0x5AE:'zar'};
const CAND=[...C.filter(c=>c[0]!=42).map(c=>({n:c[0],k:c[3],l:c[2]})),{n:15,k:['kad','kad','ger'],l:C[14][2]}].sort((x,y)=>y.k.length-x.k.length);
function segment(verse){const ws=verse.replace(/<[^>]*>/g,'').replace(/\{[^}]*\}/g,'').replace(/&\w+;/g,' ').trim().replace(/\u2060/g,'').split(/\s+/).filter(w=>w&&w!='\u05C3'&&w!='\u05C0');
 const seq=[];ws.forEach((w,i)=>{for(const ch of w){const c=ch.codePointAt(0);if(MK[c]){if(!(seq.length&&seq[seq.length-1].w==i&&seq[seq.length-1].k==MK[c]))seq.push({k:MK[c],w:i})}else if(c==0x5BD&&i==ws.length-1&&!(seq.length&&seq[seq.length-1].w==i&&seq[seq.length-1].k=='sof'))seq.push({k:'sof',w:i})}});
 const wt=ws.map((_,i)=>{const ks=seq.filter(s=>s.w==i).map(s=>s.k);return ks.some(k=>K[k]&&K[k][4]=='D')?'D':ks.length?'C':''});const out=[];let p=0,ws0=0;while(p<seq.length){let m=CAND.find(c=>c.k.every((k,j)=>seq[p+j]&&seq[p+j].k==k));const len=m?m.k.length:1;const last=seq[p+len-1].w;out.push({w:ws.slice(ws0,last+1),t:wt.slice(ws0,last+1),k:seq.slice(p,p+len).map(s=>s.k),m});ws0=last+1;p+=len}
 if(out.length&&ws0<ws.length){out[out.length-1].w.push(...ws.slice(ws0));out[out.length-1].t.push(...wt.slice(ws0))}if(!out.length&&ws.length)out.push({w:ws,t:wt,k:[],m:null});return out}

const SAMPLE=['בְּרֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַשָּׁמַ֖יִם וְאֵ֥ת הָאָֽרֶץ׃','וְהָאָ֗רֶץ הָיְתָ֥ה תֹ֙הוּ֙ וָבֹ֔הוּ וְחֹ֖שֶׁךְ עַל־פְּנֵ֣י תְה֑וֹם וְר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל־פְּנֵ֥י הַמָּֽיִם׃','וַיֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽיְהִי־אֽוֹר׃','וַיַּ֧רְא אֱלֹהִ֛ים אֶת־הָא֖וֹר כִּי־ט֑וֹב וַיַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָא֖וֹר וּבֵ֥ין הַחֹֽשֶׁךְ׃','וַיִּקְרָ֨א אֱלֹהִ֤ים ׀ לָאוֹר֙ י֔וֹם וְלַחֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם אֶחָֽד׃','וַיֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּת֣וֹךְ הַמָּ֑יִם וִיהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָמָֽיִם׃','וַיַּ֣עַשׂ אֱלֹהִים֮ אֶת־הָרָקִ֒יעַ֒ וַיַּבְדֵּ֗ל בֵּ֤ין הַמַּ֙יִם֙ אֲשֶׁר֙ מִתַּ֣חַת לָרָקִ֔יעַ וּבֵ֣ין הַמַּ֔יִם אֲשֶׁ֖ר מֵעַ֣ל לָרָקִ֑יעַ וַֽיְהִי־כֵֽן׃','וַיִּקְרָ֧א אֱלֹהִ֛ים לָֽרָקִ֖יעַ שָׁמָ֑יִם וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם שֵׁנִֽי׃','וַיֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַמַּ֜יִם מִתַּ֤חַת הַשָּׁמַ֙יִם֙ אֶל־מָק֣וֹם אֶחָ֔ד וְתֵרָאֶ֖ה הַיַּבָּשָׁ֑ה וַֽיְהִי־כֵֽן׃','וַיִּקְרָ֨א אֱלֹהִ֤ים לַיַּבָּשָׁה֙ אֶ֔רֶץ וּלְמִקְוֵ֥ה הַמַּ֖יִם קָרָ֣א יַמִּ֑ים וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃','וַיֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָאָ֙רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְמִינ֔וֹ אֲשֶׁ֥ר זַרְעוֹ־ב֖וֹ עַל־הָאָ֑רֶץ וַֽיְהִי־כֵֽן׃','וַתּוֹצֵ֨א הָאָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֙רַע֙ לְמִינֵ֔הוּ וְעֵ֧ץ עֹֽשֶׂה־פְּרִ֛י אֲשֶׁ֥ר זַרְעוֹ־ב֖וֹ לְמִינֵ֑הוּ וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃','וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי׃'];

const BK=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy'];

const refName=()=>{const r=tx.ref;if(!r)return '';const b=I[LANG].books;return r.kind=='ch'?b[r.b]+' '+r.c:r.kind=='sample'?b[0]+' 1:1–13':t('x_pasted')};
function setTextQuiet(arr,ref){tx.verses=arr.map(v=>segment(v));tx.ref=ref}

async function sefGet(bk,ch){const key='taamim_ch_'+bk+'.'+ch;const c=LS.get(key,null);if(c)return c;const flat=x=>[].concat(...[].concat(x)).map(String);let arr;
 try{const r=await fetch(`https://www.sefaria.org/api/v3/texts/${bk}.${ch}?version=hebrew&return_format=text_only`);if(!r.ok)throw 0;arr=flat((await r.json()).versions[0].text)}
 catch(e){const r=await fetch(`https://www.sefaria.org/api/texts/${bk}.${ch}?context=0&commentary=0&pad=0`);if(!r.ok)throw 0;arr=flat((await r.json()).he)}
 if(!arr.length||!arr.some(s=>/[\u0591-\u05AF]/.test(s)))throw 0;LS.set(key,arr);return arr}
async function openCh(bk,ch){tx.bk=bk;tx.ch=ch;tx.busy=true;tx.mk='x_loading';closeDt();render();
 try{setTextQuiet(await sefGet(bk,ch),{kind:'ch',b:BK.indexOf(bk),c:ch});tx.mk=null}catch(e){if(bk=='Genesis'&&ch==1){setTextQuiet(SAMPLE,{kind:'sample'});tx.mk='x_fallback'}else tx.mk='x_fail'}
 tx.busy=false;render()}
function text(){if(!tx.verses.length&&!tx.busy)openCh('Genesis',1);else render()}
function goCh(){openCh(document.getElementById('bk').value,Math.max(1,+document.getElementById('chn').value||1))}
function render(){if(cur!=4)return;
 M().innerHTML=`<div class="card"><h2><i>${ic('scroll',26)}</i>${t('x_title')}</h2><p>${t('x_hint')}</p>
 <div class="chips"><select id="bk" class="btn">${BK.map((b,i)=>`<option value="${b}" ${b==tx.bk?'selected':''}>${I[LANG].books[i]}</option>`).join('')}</select><input id="chn" class="btn" type="number" min="1" max="50" value="${tx.ch}" style="width:80px"><button onclick="goCh()">${t('x_show')}</button></div>${tx.mk?`<p class="sc2">${t(tx.mk)}</p>`:''}
 <details><summary class="sc2" style="cursor:pointer">${t('x_own')}</summary><textarea id="pt" class="btn he" rows="3" placeholder="${t('x_ph')}" style="width:100%;border-radius:14px;font-size:1.3rem;margin-top:8px"></textarea><div class="chips" style="margin-top:8px"><button onclick="pasteGo()">${t('x_parse')}</button></div></details></div>`+
 (tx.verses.length?`<div class="card"><div class="legend">${DP()}${CP()}</div><p class="sc2">${t('x_legend',{ref:refName()})}</p>`+tx.verses.map((v,vi)=>`<div class="he" style="font-size:1.7rem;line-height:2.4;margin:6px 0"><span class="sc2" style="font-family:inherit;font-size:.9rem">${vi+1}</span> ${v.map((c,ci)=>`<span class="ck ${c.m?'m':'x'}" onclick="selCk(${vi},${ci})">${c.w.map((w,i)=>`<span class="w${c.t[i]}">${w}</span>`).join(' ')}</span>`).join(' ')}</div>`).join('')+'</div>':'')+'<div id="dt" style="display:none"></div>'}

function closeDt(){stopAll();const d=document.getElementById('dt');if(d)d.style.display='none'}

 document.querySelectorAll('.ck.on').forEach(e=>e.classList.remove('on'));
 const el=document.querySelectorAll('.ck');let idx=0;for(let i=0;i<vi;i++)idx+=tx.verses[i].length;el[idx+ci].classList.add('on');
 const names=c.k.map(k=>K[k][1]).join(' · ');d.className='dt';d.style.display='block';
 d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${c.m?'№'+c.m.n+' · '+cl(C[c.m.n-1]):t('x_nomatch')}</b><button class="btn" onclick="closeDt()" aria-label="${t('x_close')}" style="min-height:36px;padding:4px 12px">✕</button></div><div class="he" style="font-size:2.4rem;display:flex;gap:10px;justify-content:center;margin:6px 0">${c.k.map(gl).join('')}</div><p class="sc2" style="text-align:center;margin:0 0 8px">${names}</p>${c.m&&AUDIO[c.m.n]?`<div style="text-align:center"><button class="btn pb" id="pb${c.m.n}" onclick="tog(${c.m.n})">${ic('play',18)}${t('listen')}</button></div>`:c.m?'':`<p class="sc2" style="margin:0">${t('x_single')}</p>`}`}
document.documentElement.lang=LANG;hdr();nav();
